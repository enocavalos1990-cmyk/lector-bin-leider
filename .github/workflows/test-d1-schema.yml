name: Verificar esquema D1
on:
  push:
    branches:
      - sincronizacion-celular-pc
    paths:
      - 'migrations/**'
      - 'tests/**'
      - '.github/workflows/test-d1-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar siete pruebas SQLite D1
        run: python -m unittest discover -s tests -p 'test_*.py' -v
