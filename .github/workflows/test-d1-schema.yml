name: Verificar esquema D1
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar pruebas SQLite D1
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pruebas API de sincronizacion
        run: node --test tests/test-sync-api.mjs
      - name: Comprobar empaquetado Worker sin publicar
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/lector-leider-build
