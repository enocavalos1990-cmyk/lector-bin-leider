# Preparación para el Worker ORIGINAL lector-bin-leider.
# Configuracion para D1 real; no desplegar antes de migrar tablas y autorizar dispositivos.
name = "lector-bin-leider"
main = "src/worker-entry.js"
compatibility_date = "2026-10-17"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "lector-bin-leider"
database_id = "7ef1c560-a37e-4c90-b898-a9456107f7ac"

# Uso esperado una vez que D1 esté configurada:
# wrangler d1 migrations apply lector-bin-leider --remote
# wrangler deploy
